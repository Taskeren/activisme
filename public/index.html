<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activism Report Backend</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<div id="app" class="flex items-center justify-center min-h-screen bg-slate-950 p-4 antialiased text-slate-200">
  <div
    class="w-full max-w-md p-8 rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl backdrop-blur-sm flex flex-col gap-6">
    <div class="space-y-1 text-center">
      <h1
        class="text-2xl font-bold tracking-tight text-white bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
        Activism Report Backend
      </h1>
      <p class="text-xs text-slate-400">Enter your Bungie Name to look up backend records</p>
    </div>
    <div class="flex flex-col gap-2">
      <label for="bungieName" class="text-sm font-medium text-slate-300 tracking-wide">
        Bungie Name
      </label>
      <div class="relative">
        <input
          type="text"
          placeholder="MyName#1234"
          id="bungieName"
          class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all duration-200 text-sm"
        >
      </div>
    </div>
    <input
      type="button"
      value="Search User"
      id="searchUser"
      class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-950/50 cursor-pointer active:scale-[0.98] transition-all duration-150 text-sm tracking-wide"
    >
    <p id="message"
       class="text-center text-sm font-medium text-slate-400 empty:hidden min-h-[20px] pt-1 border-t border-slate-800/50"></p>
  </div>
</div>
<script>
  /** @types HTMLInputElement */
  const bungieName = document.querySelector("#bungieName");
  /** @types HTMLInputElement */
  const searchUser = document.querySelector("#searchUser");
  /** @types HTMLParagraphElement */
  const message = document.querySelector("#message");
  searchUser.addEventListener("click", async () => {
    // prevent multiple requests
    searchUser.disabled = true;
    try {
      const value = bungieName.value;
      const resp = await fetch("/api/search-user?main=1", {
        method: "POST",
        body: JSON.stringify(value),
      });
      const data = await resp.json();
      const users = data.data;
      if (users.length === 0) {
        message.innerText = "No users found";
      } else if (users.length === 1) {
        const user = users[0];
        const resp = await fetch(`/api/get-history2/${user.membershipType}/${user.membershipId}`);
        const data = await resp.json();
        console.info(data);
        message.innerText = "Exported histories to console";
        // download the text
        const blob = new Blob([JSON.stringify(data, undefined, 2)], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `exported-${value}.json`;
        link.click();
        URL.revokeObjectURL(link.href);
      } else {
        message.innerText = "Many users found";
      }
    } finally {
      // unlock the button
      searchUser.disabled = false;
    }
  });
</script>
</body>
</html>
